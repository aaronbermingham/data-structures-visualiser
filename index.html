<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singly Linked List Visualization</title>
    <link rel="stylesheet" href="src/css/main.css">
</head>
<body>
    <h1>Singly Linked List Visualization</h1>
    <div>
        <input type="number" id="node-value" placeholder="Enter node value" />
        <button id="add-node-btn">Push</button>
        <button id="remove-node-btn">Pop</button>
        <button id="shift-node-btn">Shift</button>
        <button id="unshift-node-btn">Unshift</button>
    </div>
    <div id="list-container"></div>
    
    <script src="src/js/structures/SinglyLinkedList.js"></script>
    <script src="src/js/visualiser.js"></script>
</body>
</html>
